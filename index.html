<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pokemon World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <button id="theme-toggle" class="theme-toggle" role="switch" aria-checked="true" aria-label="Toggle dark and light mode">
      <span class="knob"></span>
    </button>
    <h1>My Pokemon Collection</h1>
    <p class="subtitle">Simply DEbest</p>
    <input
      type="search"
      id="search"
      placeholder="Find your Pokemon"
      aria-label="Find your Pokemon"
      autocomplete="off"
    >
  </header>

  <main>
    <p id="status" class="status" aria-live="polite"></p>
    <section id="grid" class="grid"></section>
  </main>

  <nav class="pager">
    <button id="prev" class="pager-btn">Previous</button>
    <span id="page-info">Page 1</span>
    <button id="next" class="pager-btn">Next</button>
  </nav>

  <script src="script.js"></script>
</body>
</html>
